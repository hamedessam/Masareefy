<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Masareefy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f7cff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Masareefy">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --card2:#1e222b;
    --accent:#4f7cff;
    --accent2:#2ecc9c;
    --danger:#ff5d6c;
    --text:#eef0f5;
    --muted:#8a90a2;
    --border:#262b36;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
  }
  header{
    padding:20px 16px 10px;
    text-align:center;
  }
  header h1{margin:0;font-size:22px;font-weight:800;}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px;}
  header .credit{margin-top:6px;color:var(--muted);font-size:11px;letter-spacing:.3px;}

  .summary{
    display:flex;
    gap:10px;
    padding:14px 16px;
    max-width:520px;
    margin:0 auto;
  }
  .summary .box{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 10px;
    text-align:center;
  }
  .summary .box .val{font-size:20px;font-weight:800;}
  .summary .box .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .summary .box.month .val{color:var(--accent);}
  .summary .box.month{padding:20px 10px;}
  .summary .box.month .val{font-size:30px;}
  .summary .box.month .unit{font-size:15px;font-weight:600;color:var(--muted);}
  .summary .box.month .today-sub{margin-top:8px;font-size:12px;color:var(--muted);}
  .summary .box.month .today-sub span{color:var(--accent2);font-weight:700;}

  .month-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 0 14px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .month-tabs::-webkit-scrollbar{display:none;}
  .month-tab{
    flex-shrink:0;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .month-tab.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .container{max-width:520px;margin:0 auto;padding:0 16px;}

  .drive-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    font-size:13px;
    gap:8px;
  }
  .drive-bar .status{display:flex;align-items:center;gap:8px;color:var(--muted);min-width:0;}
  .drive-bar .status span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drive-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex-shrink:0;}
  .drive-dot.on{background:var(--accent2);}
  .drive-btn{
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:7px 12px;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .drive-btn.connected{color:var(--accent2);border-color:var(--accent2);}

  form{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .row{display:flex;gap:10px;}
  label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block;}
  input, select{
    width:100%;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px;
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
  }
  input:focus, select:focus{outline:none;border-color:var(--accent);}
  .cats{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .cat-btn{
    padding:9px 12px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .cat-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .cat-btn.add-new{
    border-style:dashed;
    color:var(--muted);
  }
  .add-cat-row{
    display:flex;
    gap:8px;
    margin-top:2px;
  }
  .add-cat-row input{flex:1;}
  .add-cat-row button{
    background:var(--accent2);
    color:#0f1115;
    border:none;
    padding:0 16px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  button.submit{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  button.submit:active{opacity:.85;}

  .section-title{
    font-size:14px;
    color:var(--muted);
    margin:18px 0 8px;
    font-weight:700;
  }

  .cat-breakdown{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:8px;
  }
  .cat-row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
  }
  .cat-row .amt{font-weight:800;color:var(--accent2);}

  .expense-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .expense-item .left{display:flex;flex-direction:column;gap:2px;}
  .expense-item .cat{font-size:14px;font-weight:700;}
  .expense-item .date{font-size:11px;color:var(--muted);}
  .expense-item .note{font-size:12px;color:var(--muted);}
  .expense-item .right{display:flex;align-items:center;gap:10px;}
  .expense-item .amt{font-size:15px;font-weight:800;}
  .del-btn{
    background:none;
    border:none;
    color:var(--danger);
    font-size:18px;
    cursor:pointer;
    padding:4px 6px;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px 0;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:24px 16px 0;
  }
</style>
</head>
<body>

<header>
  <h1>💰 Masareefy</h1>
  <p>Track your daily expenses and monthly total</p>
  <div class="credit">Made by Hamed Essam</div>
</header>

<div class="summary">
  <div class="box month">
    <div class="val"><span id="monthTotal">0</span> <span class="unit">EGP</span></div>
    <div class="lbl" id="monthLabel">This Month</div>
    <div class="today-sub">Today: <span id="todayTotal">0</span> EGP</div>
  </div>
</div>

<div class="container">

  <div class="month-tabs" id="monthTabs"></div>

  <div class="drive-bar">
    <div class="status">
      <span class="drive-dot" id="driveDot"></span>
      <span id="driveStatusText">Not connected to Google Drive</span>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="drive-btn" id="restoreBtn" style="display:none;">Restore</button>
      <button class="drive-btn" id="driveBtn">Connect Drive</button>
    </div>
  </div>

  <form id="expenseForm">
    <div class="row">
      <div style="flex:1">
        <label>Amount (EGP)</label>
        <input type="number" id="amount" inputmode="decimal" placeholder="e.g. 150" required min="0" step="0.01">
      </div>
      <div style="flex:1">
        <label>Date</label>
        <input type="date" id="date" required>
      </div>
    </div>

    <div>
      <label>Category</label>
      <div class="cats" id="catButtons"></div>
      <div class="add-cat-row" id="addCatRow" style="display:none;">
        <input type="text" id="newCatInput" placeholder="New category name">
        <button type="button" id="confirmAddCat">Add</button>
      </div>
    </div>

    <div>
      <label>Note (optional)</label>
      <input type="text" id="note" placeholder="e.g. Lunch with friends">
    </div>

    <button type="submit" class="submit">➕ Add Expense</button>
  </form>

  <div class="section-title">Breakdown by Category (This Month)</div>
  <div class="cat-breakdown" id="catBreakdown"></div>

  <div class="section-title">Recent Expenses</div>
  <div id="expenseList"></div>

</div>

<footer>Masareefy · Made by Hamed Essam</footer>

<script>
const DEFAULT_CATEGORIES = ["Food", "Transport", "Shopping", "Bills", "Entertainment", "Health", "Padel", "Other"];
const CATEGORY_EMOJI = {
  "Food": "🍔",
  "Transport": "🚕",
  "Shopping": "🛍️",
  "Bills": "💡",
  "Entertainment": "🎬",
  "Health": "🏥",
  "Padel": "🎾",
  "Other": "🗂️",
  "Uncategorized": "❔"
};
function catEmoji(name){
  return CATEGORY_EMOJI[name] ? CATEGORY_EMOJI[name] + " " : "";
}
const STORAGE_KEY = "expenses_data_v1";
const CATEGORIES_KEY = "categories_v1";

let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let CATEGORIES = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || "null") || DEFAULT_CATEGORIES.slice();
let selectedCat = CATEGORIES[0];

const dateInput = document.getElementById("date");
const todayStr = new Date().toISOString().slice(0,10);
dateInput.value = todayStr;

function saveCategories(){
  localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES));
}

function renderCatButtons(){
  const wrap = document.getElementById("catButtons");
  wrap.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("div");
    btn.className = "cat-btn" + (cat === selectedCat ? " active" : "");
    btn.textContent = catEmoji(cat) + cat;
    btn.onclick = () => { selectedCat = cat; renderCatButtons(); };
    wrap.appendChild(btn);
  });
  const addBtn = document.createElement("div");
  addBtn.className = "cat-btn add-new";
  addBtn.textContent = "+ New";
  addBtn.onclick = () => {
    const row = document.getElementById("addCatRow");
    row.style.display = row.style.display === "none" ? "flex" : "none";
    if (row.style.display === "flex") document.getElementById("newCatInput").focus();
  };
  wrap.appendChild(addBtn);
}

document.getElementById("confirmAddCat").addEventListener("click", addNewCategory);
document.getElementById("newCatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); addNewCategory(); }
});

function addNewCategory(){
  const input = document.getElementById("newCatInput");
  const name = input.value.trim();
  if (!name) return;
  if (!CATEGORIES.includes(name)) {
    CATEGORIES.push(name);
    saveCategories();
    triggerBackup();
  }
  selectedCat = name;
  input.value = "";
  document.getElementById("addCatRow").style.display = "none";
  renderCatButtons();
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  triggerBackup();
}

function fmt(n){
  return Number(n).toLocaleString("en-US", {maximumFractionDigits: 2});
}

function monthKey(dateStr){
  return dateStr.slice(0,7); // YYYY-MM
}

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function monthLabel(key){
  const [y, m] = key.split("-");
  return MONTH_NAMES[parseInt(m,10)-1].slice(0,3) + " " + y;
}

let selectedMonth = monthKey(todayStr);

function getMonthList(){
  const set = new Set(expenses.map(e => monthKey(e.date)));
  set.add(monthKey(todayStr)); // always include current month, even with 0 expenses
  return Array.from(set).sort((a,b) => b.localeCompare(a)); // newest first
}

function renderMonthTabs(){
  const wrap = document.getElementById("monthTabs");
  wrap.innerHTML = "";
  const months = getMonthList();
  months.forEach(key => {
    const tab = document.createElement("div");
    tab.className = "month-tab" + (key === selectedMonth ? " active" : "");
    tab.textContent = monthLabel(key);
    tab.onclick = () => { selectedMonth = key; renderMonthTabs(); render(); };
    wrap.appendChild(tab);
  });
}

function render(){
  // keep selectedMonth pointing at the real current month if the day rolled over
  const realCurrentMonth = monthKey(todayStr);
  if (!getMonthList().includes(selectedMonth)) {
    selectedMonth = realCurrentMonth;
  }

  const monthExpenses = expenses.filter(e => monthKey(e.date) === selectedMonth);
  const monthTotal = monthExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const todayTotal = expenses.filter(e => e.date === todayStr)
                              .reduce((s,e)=>s+Number(e.amount),0);

  document.getElementById("monthTotal").textContent = fmt(monthTotal);
  document.getElementById("todayTotal").textContent = fmt(todayTotal);
  document.getElementById("monthLabel").textContent = monthLabel(selectedMonth) + " Total";

  const byCat = {};
  monthExpenses.forEach(e => {
    byCat[e.category] = (byCat[e.category]||0) + Number(e.amount);
  });
  const catWrap = document.getElementById("catBreakdown");
  catWrap.innerHTML = "";
  const sortedCats = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  if(sortedCats.length === 0){
    catWrap.innerHTML = '<div class="empty">No expenses recorded this month yet</div>';
  } else {
    sortedCats.forEach(cat => {
      const row = document.createElement("div");
      row.className = "cat-row";
      row.innerHTML = `<span>${catEmoji(cat)}${cat}</span><span class="amt">EGP ${fmt(byCat[cat])}</span>`;
      catWrap.appendChild(row);
    });
  }

  const listWrap = document.getElementById("expenseList");
  listWrap.innerHTML = "";
  const sorted = [...monthExpenses].sort((a,b) => (b.date+b.id) > (a.date+a.id) ? 1 : -1).slice(0,30);
  if(sorted.length === 0){
    listWrap.innerHTML = '<div class="empty">No expenses recorded for this month yet</div>';
  } else {
    sorted.forEach(e => {
      const item = document.createElement("div");
      item.className = "expense-item";
      item.innerHTML = `
        <div class="left">
          <span class="cat">${catEmoji(e.category)}${e.category}</span>
          <span class="date">${e.date}${e.note ? " · " + e.note : ""}</span>
        </div>
        <div class="right">
          <span class="amt">EGP ${fmt(e.amount)}</span>
          <button class="del-btn" data-id="${e.id}">✕</button>
        </div>
      `;
      listWrap.appendChild(item);
    });
    listWrap.querySelectorAll(".del-btn").forEach(btn => {
      btn.onclick = () => {
        expenses = expenses.filter(e => e.id !== btn.dataset.id);
        save();
        renderMonthTabs();
        render();
      };
    });
  }
}

document.getElementById("expenseForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const amount = document.getElementById("amount").value;
  const date = document.getElementById("date").value;
  const note = document.getElementById("note").value.trim();
  if(!amount || Number(amount) <= 0) return;

  expenses.push({
    id: Date.now().toString() + Math.random().toString(36).slice(2,6),
    amount: Number(amount),
    category: selectedCat,
    date: date,
    note: note
  });
  save();
  renderMonthTabs();
  render();

  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  document.getElementById("amount").focus();
});

renderCatButtons();
renderMonthTabs();
render();

// If opened via the "Add Expense" home screen shortcut, jump straight to the form
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("action") === "add") {
  setTimeout(() => {
    const amountInput = document.getElementById("amount");
    document.getElementById("expenseForm").scrollIntoView({ behavior: "smooth", block: "start" });
    amountInput.focus();
  }, 150);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// ====== Google Drive Backup ======
const GOOGLE_CLIENT_ID = "931654449000-44b3jrfvpdvlpbcsah0sj0alggkourbg.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const BACKUP_FILENAME = "masarify_backup.json";

let driveAccessToken = null;
let driveFileId = localStorage.getItem("drive_file_id") || null;
let tokenClient = null;
let driveConnected = localStorage.getItem("drive_connected") === "1";

function setDriveStatus(connected, text){
  const dot = document.getElementById("driveDot");
  const txt = document.getElementById("driveStatusText");
  const btn = document.getElementById("driveBtn");
  const restoreBtn = document.getElementById("restoreBtn");
  dot.classList.toggle("on", connected);
  txt.textContent = text || (connected ? "Connected to Google Drive" : "Not connected to Google Drive");
  btn.textContent = connected ? "Connected ✓" : "Connect Drive";
  btn.classList.toggle("connected", connected);
  restoreBtn.style.display = connected ? "inline-block" : "none";
}

function initGoogleDrive(){
  if (typeof google === "undefined" || !google.accounts) {
    setTimeout(initGoogleDrive, 400);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp && resp.access_token) {
        driveAccessToken = resp.access_token;
        driveConnected = true;
        localStorage.setItem("drive_connected", "1");
        setDriveStatus(true);
        backupToDrive();
      }
    },
  });
  setDriveStatus(driveConnected, driveConnected ? "Connected to Google Drive" : "Not connected to Google Drive");
}

document.getElementById("driveBtn").addEventListener("click", () => {
  if (!tokenClient) return;
  tokenClient.requestAccessToken({ prompt: driveConnected ? "none" : "consent" });
});

async function findExistingBackupFile(){
  const res = await fetch(
    "https://www.googleapis.com/drive/v3/files?q=" +
      encodeURIComponent(`name='${BACKUP_FILENAME}' and trashed=false`) +
      "&spaces=drive&fields=files(id,name)",
    { headers: { Authorization: "Bearer " + driveAccessToken } }
  );
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    driveFileId = data.files[0].id;
    localStorage.setItem("drive_file_id", driveFileId);
    return driveFileId;
  }
  return null;
}

function triggerBackup(){
  if (driveAccessToken) { backupToDrive(); return; }
  if (driveConnected && tokenClient) {
    // silent refresh only happens here, inside a real user action (tap),
    // so the browser won't flag it as a blocked pop-up
    tokenClient.requestAccessToken({ prompt: "none" });
  }
}

async function backupToDrive(){
  if (!driveAccessToken || !driveConnected) return;
  try {
    if (!driveFileId) {
      await findExistingBackupFile();
    }

    const content = JSON.stringify({ expenses, categories: CATEGORIES, exportedAt: new Date().toISOString() }, null, 2);
    const metadata = { name: BACKUP_FILENAME, mimeType: "application/json" };

    if (driveFileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: "PATCH",
        headers: {
          Authorization: "Bearer " + driveAccessToken,
          "Content-Type": "application/json",
        },
        body: content,
      });
    } else {
      const boundary = "masarify_boundary";
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
        JSON.stringify(metadata) +
        `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
        content +
        `\r\n--${boundary}--`;

      const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + driveAccessToken,
          "Content-Type": `multipart/related; boundary=${boundary}`,
        },
        body,
      });
      const data = await res.json();
      if (data.id) {
        driveFileId = data.id;
        localStorage.setItem("drive_file_id", driveFileId);
      }
    }
    setDriveStatus(true, "Last backup: " + new Date().toLocaleTimeString("en-US"));
  } catch (err) {
    setDriveStatus(true, "Backup failed, will retry later");
  }
}

window.addEventListener("load", initGoogleDrive);

async function restoreFromDrive(){
  if (!driveAccessToken) {
    alert("You need to connect to Drive first.");
    return;
  }
  if (!confirm("This will replace all expenses on this device with the backup saved on Drive. Are you sure?")) {
    return;
  }
  try {
    if (!driveFileId) {
      await findExistingBackupFile();
    }
    if (!driveFileId) {
      alert("No backup found on Drive yet.");
      return;
    }
    const res = await fetch(
      `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
      { headers: { Authorization: "Bearer " + driveAccessToken } }
    );
    const data = await res.json();
    if (Array.isArray(data.expenses)) {
      expenses = data.expenses;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
      if (Array.isArray(data.categories) && data.categories.length > 0) {
        CATEGORIES = data.categories;
        saveCategories();
      }
      renderCatButtons();
      renderMonthTabs();
      render();
      alert("Restored successfully ✅");
    } else {
      alert("The file on Drive isn't in the expected format.");
    }
  } catch (err) {
    alert("Something went wrong while restoring. Please try again.");
  }
}

document.getElementById("restoreBtn").addEventListener("click", restoreFromDrive);
</script>

</body>
</html>
