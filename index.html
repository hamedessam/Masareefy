<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Masareefy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f7cff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Masareefy">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --card2:#1e222b;
    --accent:#4f7cff;
    --accent2:#2ecc9c;
    --danger:#ff5d6c;
    --text:#eef0f5;
    --muted:#8a90a2;
    --border:#262b36;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
  }
  header{
    padding:20px 16px 10px;
    text-align:center;
  }
  header h1{margin:0;font-size:22px;font-weight:800;}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px;}
  header .credit{margin-top:6px;color:var(--muted);font-size:11px;letter-spacing:.3px;}

  .summary{
    display:flex;
    gap:10px;
    padding:14px 16px;
    max-width:520px;
    margin:0 auto;
  }
  .summary .box{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 10px;
    text-align:center;
  }
  .summary .box .val{font-size:20px;font-weight:800;}
  .summary .box .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .summary .box.month .val{color:var(--accent);}
  .summary .box.month{padding:20px 10px;}
  .summary .box.month .val{font-size:30px;}
  .summary .box.month .unit{font-size:15px;font-weight:600;color:var(--muted);}
  .summary .box.month .today-sub{margin-top:8px;font-size:12px;color:var(--muted);}
  .summary .box.month .today-sub span{color:var(--accent2);font-weight:700;}

  .month-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 0 14px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .month-tabs::-webkit-scrollbar{display:none;}
  .month-tab{
    flex-shrink:0;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .month-tab.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .container{max-width:520px;margin:0 auto;padding:0 16px;}

  .drive-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    font-size:13px;
    gap:8px;
  }
  .drive-bar .status{display:flex;align-items:center;gap:8px;color:var(--muted);min-width:0;}
  .drive-bar .status span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drive-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex-shrink:0;}
  .drive-dot.on{background:var(--accent2);}
  .drive-btn{
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:7px 12px;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .drive-btn.connected{color:var(--accent2);border-color:var(--accent2);}

  .wallet-bar{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    align-items:center;
  }
  .wallet-bar select{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
  }
  .wallet-bar button{
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }

  form{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .row{display:flex;gap:10px;}
  label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block;}
  input, select{
    width:100%;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px;
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
  }
  input:focus, select:focus{outline:none;border-color:var(--accent);}
  .cats{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .cat-btn{
    padding:9px 12px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .cat-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .cat-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .cat-del{
    color:var(--muted);
    font-size:11px;
    opacity:0.6;
  }
  .cat-btn.active .cat-del{color:rgba(255,255,255,0.8);}
  .cat-btn.add-new{
    border-style:dashed;
    color:var(--muted);
  }
  .add-cat-row{
    display:flex;
    gap:8px;
    margin-top:2px;
  }
  .add-cat-row input{flex:1;}
  .add-cat-row button{
    background:var(--accent2);
    color:#0f1115;
    border:none;
    padding:0 16px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  button.submit{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  button.submit:active{opacity:.85;}

  .section-title{
    font-size:14px;
    color:var(--muted);
    margin:18px 0 8px;
    font-weight:700;
  }

  .cat-breakdown{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:8px;
  }
  .cat-row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
  }
  .cat-row .amt{font-weight:800;color:var(--accent2);}

  .expense-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .expense-item .left{display:flex;flex-direction:column;gap:2px;}
  .expense-item .cat{font-size:14px;font-weight:700;}
  .expense-item .date{font-size:11px;color:var(--muted);}
  .expense-item .note{font-size:12px;color:var(--muted);}
  .expense-item .right{display:flex;align-items:center;gap:10px;}
  .expense-item .amt{font-size:15px;font-weight:800;}
  .del-btn{
    background:none;
    border:none;
    color:var(--danger);
    font-size:18px;
    cursor:pointer;
    padding:4px 6px;
  }
  .edit-btn{
    background:none;
    border:none;
    color:var(--accent);
    font-size:16px;
    cursor:pointer;
    padding:4px 6px;
  }
  .filter-bar{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .filter-bar input{flex:1;}
  .filter-bar select{
    width:auto;
    max-width:130px;
    flex-shrink:0;
  }
  .cancel-edit-btn{
    background:var(--card2);
    color:var(--muted);
    border:1px solid var(--border);
    padding:11px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    display:none;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px 0;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:24px 16px 0;
  }

  .modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:1000;
    padding:0;
  }
  .modal-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px 20px 0 0;
    padding:20px;
    width:100%;
    max-width:520px;
    max-height:75vh;
    overflow-y:auto;
  }
  .modal-box h3{
    margin:0 0 14px;
    font-size:15px;
    font-weight:700;
    color:var(--text);
  }
  .modal-box .cats{margin-bottom:14px;}
  .modal-box .cat-btn{cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>💰 Masareefy</h1>
  <p>Track your daily expenses and monthly total</p>
  <div class="credit">Made by Hamed Essam</div>
</header>

<div class="summary">
  <div class="box month">
    <div class="val"><span id="monthTotal">0</span> <span class="unit">EGP</span></div>
    <div class="lbl" id="monthLabel">This Month</div>
    <div class="today-sub">Today: <span id="todayTotal">0</span> EGP</div>
  </div>
</div>

<div class="container">

  <div class="wallet-bar">
    <select id="walletSelect"></select>
    <button type="button" id="renameWalletBtn" title="Rename wallet">✎</button>
    <button type="button" id="deleteWalletBtn" title="Delete wallet">🗑</button>
    <button type="button" id="newWalletBtn">+ New</button>
  </div>

  <div class="month-tabs" id="monthTabs"></div>

  <div class="drive-bar">
    <div class="status">
      <span class="drive-dot" id="syncDot"></span>
      <span id="syncStatusText">Not signed in</span>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="drive-btn" id="signInBtn">Sign in with Google</button>
      <button class="drive-btn" id="signOutBtn" style="display:none;">Sign out</button>
    </div>
  </div>

  <form id="expenseForm">
    <div class="row">
      <div style="flex:1">
        <label>Amount (EGP)</label>
        <input type="number" id="amount" inputmode="decimal" placeholder="e.g. 150" required min="0" step="0.01">
      </div>
      <div style="flex:1">
        <label>Date</label>
        <input type="date" id="date" required>
      </div>
    </div>

    <div>
      <label>Category</label>
      <div class="cats" id="catButtons"></div>
      <div class="add-cat-row" id="addCatRow" style="display:none;">
        <input type="text" id="newCatInput" placeholder="New category name">
        <button type="button" id="confirmAddCat">Add</button>
      </div>
    </div>

    <div>
      <label>Note (optional)</label>
      <input type="text" id="note" placeholder="e.g. Lunch with friends">
    </div>

    <button type="submit" class="submit">➕ Add Expense</button>
    <button type="button" class="cancel-edit-btn" id="cancelEditBtn">Cancel Edit</button>
  </form>

  <div class="section-title">Breakdown by Category (This Month)</div>
  <div class="cat-breakdown" id="catBreakdown"></div>

  <div class="section-title">Recent Expenses</div>
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search notes, category, amount...">
    <select id="filterCategory"><option value="">All</option></select>
  </div>
  <div id="expenseList"></div>

</div>

<div class="modal-overlay" id="mergeModal" style="display:none;">
  <div class="modal-box">
    <h3 id="mergeModalTitle">Move expenses to:</h3>
    <div class="cats" id="mergeModalOptions"></div>
    <button type="button" class="cancel-edit-btn" id="mergeModalCancel" style="display:block;">Cancel</button>
  </div>
</div>

<footer>Masareefy · Made by Hamed Essam</footer>

<script>
const DEFAULT_CATEGORIES = ["Food", "Transport", "Shopping", "Bills", "Entertainment", "Health", "Padel", "Other"];
const CATEGORY_EMOJI = {
  "Food": "🍔",
  "Transport": "🚕",
  "Shopping": "🛍️",
  "Bills": "💡",
  "Entertainment": "🎬",
  "Health": "🏥",
  "Padel": "🎾",
  "Gas": "⛽",
  "Other": "🗂️",
  "Uncategorized": "❔"
};
function catEmoji(name){
  return CATEGORY_EMOJI[name] ? CATEGORY_EMOJI[name] + " " : "";
}
const STORAGE_KEY = "expenses_data_v1";
const CATEGORIES_KEY = "categories_v1";
const WALLETS_KEY = "wallets_v1";
const CURRENT_WALLET_KEY = "current_wallet_id";

let wallets = {};
let currentWalletId = null;
let expenses = [];
let CATEGORIES = [];

function loadWallets(){
  const raw = localStorage.getItem(WALLETS_KEY);
  if (raw) {
    wallets = JSON.parse(raw);
  } else {
    // migrate old single-wallet data into a "Personal" wallet
    const oldExpenses = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const oldCategories = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || "null") || DEFAULT_CATEGORIES.slice();
    wallets = { "default": { name: "Personal", expenses: oldExpenses, categories: oldCategories } };
  }
  currentWalletId = localStorage.getItem(CURRENT_WALLET_KEY);
  if (!currentWalletId || !wallets[currentWalletId]) {
    currentWalletId = Object.keys(wallets)[0];
  }
  expenses = wallets[currentWalletId].expenses;
  CATEGORIES = wallets[currentWalletId].categories;
}

function persistWallets(){
  wallets[currentWalletId].expenses = expenses;
  wallets[currentWalletId].categories = CATEGORIES;
  localStorage.setItem(WALLETS_KEY, JSON.stringify(wallets));
  localStorage.setItem(CURRENT_WALLET_KEY, currentWalletId);
}

function renderWalletSelector(){
  const sel = document.getElementById("walletSelect");
  sel.innerHTML = "";
  Object.keys(wallets).forEach(id => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = wallets[id].name;
    if (id === currentWalletId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function switchWallet(id){
  if (!wallets[id]) return;
  currentWalletId = id;
  expenses = wallets[id].expenses;
  CATEGORIES = wallets[id].categories;
  localStorage.setItem(CURRENT_WALLET_KEY, currentWalletId);
  selectedCat = CATEGORIES[0];
  selectedMonth = monthKey(todayStr);
  searchQuery = "";
  filterCategory = "";
  document.getElementById("searchInput").value = "";
  editingId = null;
  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  dateInput.value = todayStr;
  document.querySelector(".submit").textContent = "➕ Add Expense";
  document.getElementById("cancelEditBtn").style.display = "none";
  renderWalletSelector();
  renderCatButtons();
  renderMonthTabs();
  render();
}

document.getElementById("walletSelect").addEventListener("change", (e) => {
  switchWallet(e.target.value);
});

document.getElementById("newWalletBtn").addEventListener("click", () => {
  const name = prompt("New wallet name:");
  if (!name || !name.trim()) return;
  persistWallets();
  const id = "wallet_" + Date.now();
  wallets[id] = { name: name.trim(), expenses: [], categories: DEFAULT_CATEGORIES.slice() };
  switchWallet(id);
  pushToFirestore();
});

document.getElementById("renameWalletBtn").addEventListener("click", () => {
  const name = prompt("Rename wallet:", wallets[currentWalletId].name);
  if (!name || !name.trim()) return;
  wallets[currentWalletId].name = name.trim();
  persistWallets();
  renderWalletSelector();
  pushToFirestore();
});

document.getElementById("deleteWalletBtn").addEventListener("click", () => {
  if (Object.keys(wallets).length <= 1) {
    alert("You need to keep at least one wallet.");
    return;
  }
  const name = wallets[currentWalletId].name;
  if (!confirm(`Delete wallet "${name}"? All its expenses and categories will be permanently deleted. This can't be undone.`)) {
    return;
  }
  delete wallets[currentWalletId];
  currentWalletId = Object.keys(wallets)[0];
  expenses = wallets[currentWalletId].expenses;
  CATEGORIES = wallets[currentWalletId].categories;
  selectedCat = CATEGORIES[0];
  selectedMonth = monthKey(todayStr);
  persistWallets();
  renderWalletSelector();
  renderCatButtons();
  renderMonthTabs();
  render();
  pushToFirestore();
});

loadWallets();
let selectedCat = CATEGORIES[0];

const dateInput = document.getElementById("date");
const todayStr = new Date().toISOString().slice(0,10);
dateInput.value = todayStr;

function saveCategories(){
  persistWallets();
}

function renderCatButtons(){
  const wrap = document.getElementById("catButtons");
  wrap.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("div");
    btn.className = "cat-btn" + (cat === selectedCat ? " active" : "");
    const label = document.createElement("span");
    label.textContent = catEmoji(cat) + cat;
    label.onclick = () => { selectedCat = cat; renderCatButtons(); };
    btn.appendChild(label);
    const del = document.createElement("span");
    del.className = "cat-del";
    del.textContent = "✕";
    del.onclick = (e) => { e.stopPropagation(); deleteCategory(cat); };
    btn.appendChild(del);
    wrap.appendChild(btn);
  });
  const addBtn = document.createElement("div");
  addBtn.className = "cat-btn add-new";
  addBtn.textContent = "+ New";
  addBtn.onclick = () => {
    const row = document.getElementById("addCatRow");
    row.style.display = row.style.display === "none" ? "flex" : "none";
    if (row.style.display === "flex") document.getElementById("newCatInput").focus();
  };
  wrap.appendChild(addBtn);
  renderFilterCategoryOptions();
}

function deleteCategory(name){
  if (CATEGORIES.length <= 1) {
    alert("You need to keep at least one category.");
    return;
  }
  const affected = expenses.filter(e => e.category === name).length;
  if (affected === 0) {
    if (!confirm(`Delete "${name}"?`)) return;
    finalizeDeleteCategory(name, null);
    return;
  }
  openMergeModal(name, affected);
}

function openMergeModal(name, count){
  document.getElementById("mergeModalTitle").textContent =
    `Delete "${name}" — move its ${count} expense(s) to:`;
  const optsWrap = document.getElementById("mergeModalOptions");
  optsWrap.innerHTML = "";
  CATEGORIES.filter(c => c !== name).forEach(c => {
    const btn = document.createElement("div");
    btn.className = "cat-btn";
    btn.textContent = catEmoji(c) + c;
    btn.onclick = () => {
      finalizeDeleteCategory(name, c);
      closeMergeModal();
    };
    optsWrap.appendChild(btn);
  });
  document.getElementById("mergeModal").style.display = "flex";
}

function closeMergeModal(){
  document.getElementById("mergeModal").style.display = "none";
}

document.getElementById("mergeModalCancel").addEventListener("click", closeMergeModal);

function finalizeDeleteCategory(name, mergeInto){
  if (mergeInto) {
    expenses.forEach(e => { if (e.category === name) e.category = mergeInto; });
  }
  CATEGORIES = CATEGORIES.filter(c => c !== name);
  if (selectedCat === name) selectedCat = CATEGORIES[0];

  save();
  renderCatButtons();
  renderMonthTabs();
  render();
}

function renderFilterCategoryOptions(){
  const sel = document.getElementById("filterCategory");
  const current = sel.value;
  sel.innerHTML = '<option value="">All</option>';
  CATEGORIES.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = catEmoji(cat) + cat;
    sel.appendChild(opt);
  });
  sel.value = CATEGORIES.includes(current) ? current : "";
}

document.getElementById("confirmAddCat").addEventListener("click", addNewCategory);
document.getElementById("newCatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); addNewCategory(); }
});

function addNewCategory(){
  const input = document.getElementById("newCatInput");
  const name = input.value.trim();
  if (!name) return;
  if (!CATEGORIES.includes(name)) {
    CATEGORIES.push(name);
    saveCategories();
    pushToFirestore();
  }
  selectedCat = name;
  input.value = "";
  document.getElementById("addCatRow").style.display = "none";
  renderCatButtons();
}

function save(){
  persistWallets();
  pushToFirestore();
}

function fmt(n){
  return Number(n).toLocaleString("en-US", {maximumFractionDigits: 2});
}

function monthKey(dateStr){
  return dateStr.slice(0,7); // YYYY-MM
}

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function monthLabel(key){
  const [y, m] = key.split("-");
  return MONTH_NAMES[parseInt(m,10)-1].slice(0,3) + " " + y;
}

let selectedMonth = monthKey(todayStr);
let searchQuery = "";
let filterCategory = "";
let editingId = null;

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("filterCategory").addEventListener("change", (e) => {
  filterCategory = e.target.value;
  render();
});

function getMonthList(){
  const set = new Set(expenses.map(e => monthKey(e.date)));
  set.add(monthKey(todayStr)); // always include current month, even with 0 expenses
  return Array.from(set).sort((a,b) => b.localeCompare(a)); // newest first
}

function renderMonthTabs(){
  const wrap = document.getElementById("monthTabs");
  wrap.innerHTML = "";
  const months = getMonthList();
  months.forEach(key => {
    const tab = document.createElement("div");
    tab.className = "month-tab" + (key === selectedMonth ? " active" : "");
    tab.textContent = monthLabel(key);
    tab.onclick = () => { selectedMonth = key; renderMonthTabs(); render(); };
    wrap.appendChild(tab);
  });
}

function render(){
  // keep selectedMonth pointing at the real current month if the day rolled over
  const realCurrentMonth = monthKey(todayStr);
  if (!getMonthList().includes(selectedMonth)) {
    selectedMonth = realCurrentMonth;
  }

  const monthExpenses = expenses.filter(e => monthKey(e.date) === selectedMonth);
  const monthTotal = monthExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const todayTotal = expenses.filter(e => e.date === todayStr)
                              .reduce((s,e)=>s+Number(e.amount),0);

  document.getElementById("monthTotal").textContent = fmt(monthTotal);
  document.getElementById("todayTotal").textContent = fmt(todayTotal);
  document.getElementById("monthLabel").textContent = monthLabel(selectedMonth) + " Total";

  const byCat = {};
  monthExpenses.forEach(e => {
    byCat[e.category] = (byCat[e.category]||0) + Number(e.amount);
  });
  const catWrap = document.getElementById("catBreakdown");
  catWrap.innerHTML = "";
  const sortedCats = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  if(sortedCats.length === 0){
    catWrap.innerHTML = '<div class="empty">No expenses recorded this month yet</div>';
  } else {
    sortedCats.forEach(cat => {
      const row = document.createElement("div");
      row.className = "cat-row";
      row.innerHTML = `<span>${catEmoji(cat)}${cat}</span><span class="amt">EGP ${fmt(byCat[cat])}</span>`;
      catWrap.appendChild(row);
    });
  }

  const listWrap = document.getElementById("expenseList");
  listWrap.innerHTML = "";
  const filteredExpenses = monthExpenses.filter(e => {
    const matchesCat = !filterCategory || e.category === filterCategory;
    const matchesSearch = !searchQuery ||
      e.category.toLowerCase().includes(searchQuery) ||
      (e.note && e.note.toLowerCase().includes(searchQuery)) ||
      String(e.amount).includes(searchQuery) ||
      e.date.includes(searchQuery);
    return matchesCat && matchesSearch;
  });
  const sorted = [...filteredExpenses].sort((a,b) => (b.date+b.id) > (a.date+a.id) ? 1 : -1).slice(0,30);
  if(sorted.length === 0){
    listWrap.innerHTML = (searchQuery || filterCategory)
      ? '<div class="empty">No matching expenses found</div>'
      : '<div class="empty">No expenses recorded for this month yet</div>';
  } else {
    sorted.forEach(e => {
      const item = document.createElement("div");
      item.className = "expense-item";
      item.innerHTML = `
        <div class="left">
          <span class="cat">${catEmoji(e.category)}${e.category}</span>
          <span class="date">${e.date}${(e.time && e.date === todayStr) ? " · " + e.time : ""}${e.note ? " · " + e.note : ""}</span>
        </div>
        <div class="right">
          <span class="amt">EGP ${fmt(e.amount)}</span>
          <button class="edit-btn" data-id="${e.id}">✎</button>
          <button class="del-btn" data-id="${e.id}">✕</button>
        </div>
      `;
      listWrap.appendChild(item);
    });
    listWrap.querySelectorAll(".del-btn").forEach(btn => {
      btn.onclick = () => {
        expenses = expenses.filter(e => e.id !== btn.dataset.id);
        if (editingId === btn.dataset.id) cancelEdit();
        save();
        renderMonthTabs();
        render();
      };
    });
    listWrap.querySelectorAll(".edit-btn").forEach(btn => {
      btn.onclick = () => startEditExpense(btn.dataset.id);
    });
  }
}

function startEditExpense(id){
  const exp = expenses.find(e => e.id === id);
  if (!exp) return;
  editingId = id;
  document.getElementById("amount").value = exp.amount;
  document.getElementById("date").value = exp.date;
  document.getElementById("note").value = exp.note || "";
  selectedCat = exp.category;
  renderCatButtons();
  document.querySelector(".submit").textContent = "💾 Update Expense";
  document.getElementById("cancelEditBtn").style.display = "block";
  document.getElementById("expenseForm").scrollIntoView({ behavior: "smooth", block: "start" });
  document.getElementById("amount").focus();
}

function cancelEdit(){
  editingId = null;
  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  dateInput.value = todayStr;
  selectedCat = CATEGORIES[0];
  renderCatButtons();
  document.querySelector(".submit").textContent = "➕ Add Expense";
  document.getElementById("cancelEditBtn").style.display = "none";
}

document.getElementById("cancelEditBtn").addEventListener("click", cancelEdit);

document.getElementById("expenseForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const amount = document.getElementById("amount").value;
  const date = document.getElementById("date").value;
  const note = document.getElementById("note").value.trim();
  if(!amount || Number(amount) <= 0) return;

  if (editingId) {
    const idx = expenses.findIndex(e => e.id === editingId);
    if (idx !== -1) {
      expenses[idx] = {
        ...expenses[idx],
        amount: Number(amount),
        category: selectedCat,
        date: date,
        note: note
      };
    }
    editingId = null;
    document.querySelector(".submit").textContent = "➕ Add Expense";
    document.getElementById("cancelEditBtn").style.display = "none";
  } else {
    expenses.push({
      id: Date.now().toString() + Math.random().toString(36).slice(2,6),
      amount: Number(amount),
      category: selectedCat,
      date: date,
      time: date === todayStr ? new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" }) : "",
      note: note
    });
  }

  save();
  renderMonthTabs();
  render();

  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  document.getElementById("amount").focus();
});

renderWalletSelector();
renderCatButtons();
renderMonthTabs();
render();

// If opened via the "Add Expense" home screen shortcut, jump straight to the form

if (urlParams.get("action") === "add") {

    const amountInput = document.getElementById("amount");
    document.getElementById("expenseForm").scrollIntoView({ behavior: "smooth", block: "start" });
    amountInput.focus();

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();

let currentUser = null;
let unsubscribeSnapshot = null;
let syncing = false;

function setSyncStatus(connected, text){
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncStatusText");
  dot.classList.toggle("on", connected);
  txt.textContent = text || (connected ? "Signed in" : "Not signed in");
}

document.getElementById("signInBtn").addEventListener("click", () => {
  auth.signInWithPopup(googleProvider).catch(() => {
    setSyncStatus(false, "Sign-in failed, please try again");
  });
});

document.getElementById("signOutBtn").addEventListener("click", () => {
  auth.signOut();
});

auth.onAuthStateChanged((user) => {
  if (user) {
    currentUser = user;
    setSyncStatus(true, "Signed in as " + (user.email || user.displayName));
    document.getElementById("signInBtn").style.display = "none";
    document.getElementById("signOutBtn").style.display = "inline-block";
    startFirestoreSync(user.uid);
  } else {
    currentUser = null;
    setSyncStatus(false, "Not signed in");
    document.getElementById("signInBtn").style.display = "inline-block";
    document.getElementById("signOutBtn").style.display = "none";
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  }
});

function startFirestoreSync(uid){
  const docRef = db.collection("users").doc(uid);

  docRef.get().then((snap) => {
    if (snap.exists) {
      const data = snap.data();
      if (data.wallets && typeof data.wallets === "object" && Object.keys(data.wallets).length > 0) {
        wallets = data.wallets;
        if (!wallets[currentWalletId]) currentWalletId = Object.keys(wallets)[0];
        expenses = wallets[currentWalletId].expenses || [];
        CATEGORIES = wallets[currentWalletId].categories || DEFAULT_CATEGORIES.slice();
        persistWallets();
      } else if (Array.isArray(data.expenses)) {
        // old pre-wallets format on the server: migrate it into "Personal" and push it back up
        currentWalletId = "default";
        wallets[currentWalletId] = wallets[currentWalletId] || { name: "Personal", expenses: [], categories: DEFAULT_CATEGORIES.slice() };
        wallets[currentWalletId].expenses = data.expenses;
        if (Array.isArray(data.categories) && data.categories.length > 0) {
          wallets[currentWalletId].categories = data.categories;
        }
        expenses = wallets[currentWalletId].expenses;
        CATEGORIES = wallets[currentWalletId].categories;
        persistWallets();
        pushToFirestore();
      }
      renderWalletSelector();
      renderCatButtons();
      renderMonthTabs();
      render();
    } else {
      // first time this account signs in: push whatever is on this device up
      pushToFirestore();
    }

    if (unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = docRef.onSnapshot((snap) => {
      if (!snap.exists || syncing) return;
      const data = snap.data();
      if (!data.wallets) return;
      const incoming = JSON.stringify(data.wallets);
      if (incoming !== JSON.stringify(wallets)) {
        wallets = data.wallets;
        if (!wallets[currentWalletId]) currentWalletId = Object.keys(wallets)[0];
        expenses = wallets[currentWalletId].expenses || [];
        CATEGORIES = wallets[currentWalletId].categories || DEFAULT_CATEGORIES.slice();
        persistWallets();
        renderWalletSelector();
        renderCatButtons();
        renderMonthTabs();
        render();
      }
      setSyncStatus(true, "Synced · " + new Date().toLocaleTimeString("en-US"));
    });
  });
}

function pushToFirestore(){
  if (!currentUser) return;
  persistWallets();
  syncing = true;
  db.collection("users").doc(currentUser.uid).set({
    wallets,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true })
    .then(() => {
      setSyncStatus(true, "Synced · " + new Date().toLocaleTimeString("en-US"));
    })
    .catch(() => {
      setSyncStatus(true, "Sync failed, will retry");
    })
    .finally(() => { syncing = false; });
}
