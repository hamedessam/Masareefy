<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مصاريفي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f7cff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --card2:#1e222b;
    --accent:#4f7cff;
    --accent2:#2ecc9c;
    --danger:#ff5d6c;
    --text:#eef0f5;
    --muted:#8a90a2;
    --border:#262b36;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
  }
  header{
    padding:20px 16px 10px;
    text-align:center;
  }
  header h1{margin:0;font-size:22px;font-weight:800;}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px;}

  .summary{
    display:flex;
    gap:10px;
    padding:14px 16px;
    max-width:520px;
    margin:0 auto;
  }
  .summary .box{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 10px;
    text-align:center;
  }
  .summary .box .val{font-size:20px;font-weight:800;}
  .summary .box .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .summary .box.month .val{color:var(--accent);}
  .summary .box.today .val{color:var(--accent2);}

  .container{max-width:520px;margin:0 auto;padding:0 16px;}

  form{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .row{display:flex;gap:10px;}
  label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block;}
  input, select{
    width:100%;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px;
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
  }
  input:focus, select:focus{outline:none;border-color:var(--accent);}
  .cats{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .cat-btn{
    padding:9px 12px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .cat-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  button.submit{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  button.submit:active{opacity:.85;}

  .section-title{
    font-size:14px;
    color:var(--muted);
    margin:18px 0 8px;
    font-weight:700;
  }

  .cat-breakdown{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:8px;
  }
  .cat-row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
  }
  .cat-row .amt{font-weight:800;color:var(--accent2);}

  .expense-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .expense-item .left{display:flex;flex-direction:column;gap:2px;}
  .expense-item .cat{font-size:14px;font-weight:700;}
  .expense-item .date{font-size:11px;color:var(--muted);}
  .expense-item .note{font-size:12px;color:var(--muted);}
  .expense-item .right{display:flex;align-items:center;gap:10px;}
  .expense-item .amt{font-size:15px;font-weight:800;}
  .del-btn{
    background:none;
    border:none;
    color:var(--danger);
    font-size:18px;
    cursor:pointer;
    padding:4px 6px;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px 0;
  }

  .drive-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    font-size:13px;
  }
  .drive-bar .status{display:flex;align-items:center;gap:8px;color:var(--muted);}
  .drive-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex-shrink:0;}
  .drive-dot.on{background:var(--accent2);}
  .drive-btn{
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:7px 12px;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
  }
  .drive-btn.connected{color:var(--accent2);border-color:var(--accent2);}
</style>
</head>
<body>

<header>
  <h1>💰 مصاريفي</h1>
  <p>سجّل مصاريفك اليومية وتابع إجمالي الشهر</p>
</header>

<div class="summary">
  <div class="box today">
    <div class="val" id="todayTotal">0</div>
    <div class="lbl">صرفت النهارده</div>
  </div>
  <div class="box month">
    <div class="val" id="monthTotal">0</div>
    <div class="lbl" id="monthLabel">إجمالي الشهر</div>
  </div>
</div>

<div class="container">

  <div class="drive-bar">
    <div class="status">
      <span class="drive-dot" id="driveDot"></span>
      <span id="driveStatusText">مش متصل بـ Google Drive</span>
    </div>
    <button class="drive-btn" id="driveBtn">ربط Drive</button>
  </div>

  <form id="expenseForm">
    <div class="row">
      <div style="flex:1">
        <label>المبلغ (جنيه)</label>
        <input type="number" id="amount" inputmode="decimal" placeholder="مثلاً 150" required min="0" step="0.01">
      </div>
      <div style="flex:1">
        <label>التاريخ</label>
        <input type="date" id="date" required>
      </div>
    </div>

    <div>
      <label>الفئة</label>
      <div class="cats" id="catButtons"></div>
    </div>

    <div>
      <label>ملاحظة (اختياري)</label>
      <input type="text" id="note" placeholder="مثلاً غدا مع الأصحاب">
    </div>

    <button type="submit" class="submit">➕ إضافة المصروف</button>
  </form>

  <div class="section-title">تفصيل حسب الفئة (الشهر ده)</div>
  <div class="cat-breakdown" id="catBreakdown"></div>

  <div class="section-title">آخر المصاريف</div>
  <div id="expenseList"></div>

</div>

<script>
const CATEGORIES = ["أكل", "مواصلات", "تسوق", "فواتير", "ترفيه", "صحة", "بادل", "تانى"];
const STORAGE_KEY = "expenses_data_v1";

// ====== Google Drive Backup Config ======
// حط هنا الـ Client ID اللي هتاخده من Google Cloud Console
const GOOGLE_CLIENT_ID = "931654449000-44b3jrfvpdvlpbcsah0sj0alggkourbg.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const BACKUP_FILENAME = "masarify_backup.json";

let driveAccessToken = null;
let driveFileId = localStorage.getItem("drive_file_id") || null;
let tokenClient = null;
let driveConnected = localStorage.getItem("drive_connected") === "1";

function setDriveStatus(connected, text){
  const dot = document.getElementById("driveDot");
  const txt = document.getElementById("driveStatusText");
  const btn = document.getElementById("driveBtn");
  dot.classList.toggle("on", connected);
  txt.textContent = text || (connected ? "متصل بـ Google Drive" : "مش متصل بـ Google Drive");
  btn.textContent = connected ? "متصل ✓" : "ربط Drive";
  btn.classList.toggle("connected", connected);
}

function initGoogleDrive(){
  if (typeof google === "undefined" || !google.accounts) {
    setTimeout(initGoogleDrive, 400);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp && resp.access_token) {
        driveAccessToken = resp.access_token;
        driveConnected = true;
        localStorage.setItem("drive_connected", "1");
        setDriveStatus(true);
        backupToDrive();
      }
    },
  });
  setDriveStatus(driveConnected, driveConnected ? "متصل بـ Google Drive" : "مش متصل بـ Google Drive");

  // try silent token refresh on load if previously connected
  if (driveConnected) {
    tokenClient.requestAccessToken({ prompt: "none" });
  }
}

document.getElementById("driveBtn").addEventListener("click", () => {
  if (!tokenClient) return;
  tokenClient.requestAccessToken({ prompt: driveConnected ? "none" : "consent" });
});

async function findExistingBackupFile(){
  const res = await fetch(
    "https://www.googleapis.com/drive/v3/files?q=" +
      encodeURIComponent(`name='${BACKUP_FILENAME}' and trashed=false`) +
      "&spaces=drive&fields=files(id,name)",
    { headers: { Authorization: "Bearer " + driveAccessToken } }
  );
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    driveFileId = data.files[0].id;
    localStorage.setItem("drive_file_id", driveFileId);
    return driveFileId;
  }
  return null;
}

async function backupToDrive(){
  if (!driveAccessToken || !driveConnected) return;
  try {
    if (!driveFileId) {
      await findExistingBackupFile();
    }

    const content = JSON.stringify({ expenses, exportedAt: new Date().toISOString() }, null, 2);
    const metadata = { name: BACKUP_FILENAME, mimeType: "application/json" };

    if (driveFileId) {
      // update existing file
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: "PATCH",
        headers: {
          Authorization: "Bearer " + driveAccessToken,
          "Content-Type": "application/json",
        },
        body: content,
      });
    } else {
      // create new file
      const boundary = "masarify_boundary";
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
        JSON.stringify(metadata) +
        `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
        content +
        `\r\n--${boundary}--`;

      const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + driveAccessToken,
          "Content-Type": `multipart/related; boundary=${boundary}`,
        },
        body,
      });
      const data = await res.json();
      if (data.id) {
        driveFileId = data.id;
        localStorage.setItem("drive_file_id", driveFileId);
      }
    }
    setDriveStatus(true, "آخر نسخة: " + new Date().toLocaleTimeString("ar-EG"));
  } catch (err) {
    setDriveStatus(true, "فشل الرفع، هيحاول تاني بعدين");
  }
}

window.addEventListener("load", initGoogleDrive);

let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let selectedCat = CATEGORIES[0];

const dateInput = document.getElementById("date");
const todayStr = new Date().toISOString().slice(0,10);
dateInput.value = todayStr;

function renderCatButtons(){
  const wrap = document.getElementById("catButtons");
  wrap.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("div");
    btn.className = "cat-btn" + (cat === selectedCat ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => { selectedCat = cat; renderCatButtons(); };
    wrap.appendChild(btn);
  });
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  backupToDrive();
}

function fmt(n){
  return Number(n).toLocaleString("ar-EG", {maximumFractionDigits: 2});
}

function monthKey(dateStr){
  return dateStr.slice(0,7); // YYYY-MM
}

function render(){
  const currentMonth = todayStr.slice(0,7);

  // totals
  const todayTotal = expenses.filter(e => e.date === todayStr)
                              .reduce((s,e)=>s+Number(e.amount),0);
  const monthExpenses = expenses.filter(e => monthKey(e.date) === currentMonth);
  const monthTotal = monthExpenses.reduce((s,e)=>s+Number(e.amount),0);

  document.getElementById("todayTotal").textContent = fmt(todayTotal);
  document.getElementById("monthTotal").textContent = fmt(monthTotal);

  const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const mIdx = parseInt(currentMonth.split("-")[1],10)-1;
  document.getElementById("monthLabel").textContent = "إجمالي شهر " + monthNames[mIdx];

  // category breakdown for this month
  const byCat = {};
  monthExpenses.forEach(e => {
    byCat[e.category] = (byCat[e.category]||0) + Number(e.amount);
  });
  const catWrap = document.getElementById("catBreakdown");
  catWrap.innerHTML = "";
  const sortedCats = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  if(sortedCats.length === 0){
    catWrap.innerHTML = '<div class="empty">مفيش مصاريف مسجلة الشهر ده لسه</div>';
  } else {
    sortedCats.forEach(cat => {
      const row = document.createElement("div");
      row.className = "cat-row";
      row.innerHTML = `<span>${cat}</span><span class="amt">${fmt(byCat[cat])} ج.م</span>`;
      catWrap.appendChild(row);
    });
  }

  // recent list (latest 20, newest first)
  const listWrap = document.getElementById("expenseList");
  listWrap.innerHTML = "";
  const sorted = [...expenses].sort((a,b) => (b.date+b.id) > (a.date+a.id) ? 1 : -1).slice(0,20);
  if(sorted.length === 0){
    listWrap.innerHTML = '<div class="empty">مفيش مصاريف مسجلة لسه، ابدأ بإضافة أول مصروف 👆</div>';
  } else {
    sorted.forEach(e => {
      const item = document.createElement("div");
      item.className = "expense-item";
      item.innerHTML = `
        <div class="left">
          <span class="cat">${e.category}</span>
          <span class="date">${e.date}${e.note ? " · " + e.note : ""}</span>
        </div>
        <div class="right">
          <span class="amt">${fmt(e.amount)} ج.م</span>
          <button class="del-btn" data-id="${e.id}">✕</button>
        </div>
      `;
      listWrap.appendChild(item);
    });
    listWrap.querySelectorAll(".del-btn").forEach(btn => {
      btn.onclick = () => {
        expenses = expenses.filter(e => e.id !== btn.dataset.id);
        save();
        render();
      };
    });
  }
}

document.getElementById("expenseForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const amount = document.getElementById("amount").value;
  const date = document.getElementById("date").value;
  const note = document.getElementById("note").value.trim();
  if(!amount || Number(amount) <= 0) return;

  expenses.push({
    id: Date.now().toString() + Math.random().toString(36).slice(2,6),
    amount: Number(amount),
    category: selectedCat,
    date: date,
    note: note
  });
  save();
  render();

  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  document.getElementById("amount").focus();
});

renderCatButtons();
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>

</body>
</html>
